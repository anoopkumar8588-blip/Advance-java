server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:


        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/order/**
  




        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/product/**


      


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
